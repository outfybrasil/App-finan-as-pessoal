name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          echo "Verificando chaves de ambiente..."
          if [ -z "$VITE_APPWRITE_PROJECT_ID" ]; then echo "❌ ERRO: VITE_APPWRITE_PROJECT_ID continua vazio!"; else echo "✅ Chaves carregadas com sucesso."; fi
          npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT || secrets.APPWRITE_ENDPOINT || secrets.ENDPOINT || 'https://cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID || secrets.APPWRITE_PROJECT_ID || secrets.PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID || secrets.APPWRITE_DATABASE_ID || secrets.DATABASE_ID }}
          VITE_APPWRITE_TRANSACTIONS_COLLECTION_ID: ${{ secrets.VITE_APPWRITE_TRANSACTIONS_COLLECTION_ID || secrets.TRANSACTIONS_COLLECTION_ID }}
          VITE_APPWRITE_ACCOUNTS_COLLECTION_ID: ${{ secrets.VITE_APPWRITE_ACCOUNTS_COLLECTION_ID || secrets.ACCOUNTS_COLLECTION_ID }}
          VITE_APPWRITE_BUDGETS_COLLECTION_ID: ${{ secrets.VITE_APPWRITE_BUDGETS_COLLECTION_ID || secrets.BUDGETS_COLLECTION_ID }}
          VITE_APPWRITE_GOALS_COLLECTION_ID: ${{ secrets.VITE_APPWRITE_GOALS_COLLECTION_ID || secrets.GOALS_COLLECTION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || secrets.API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
